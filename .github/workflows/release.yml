name: Release

# tag（v*）触发构建 deb 并发布 GitHub Release；
# workflow_dispatch 用于在不打 tag 的情况下先验证流水线本身。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: build deb
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential curl file

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 应用通过 file:../textura-mcp 消费同级库：CI 里必须先把库放到工作区的同级目录，
      # 否则根目录的 npm ci 解析不了 file: 依赖，prebuild 钩子也跑不起来。
      - name: Checkout @textura/mcp (sibling library)
        run: |
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY_OWNER}/textura-mcp.git" "$GITHUB_WORKSPACE/../textura-mcp"
          npm --prefix "$GITHUB_WORKSPACE/../textura-mcp" ci
          npm --prefix "$GITHUB_WORKSPACE/../textura-mcp" run build

      - name: Install app dependencies
        run: npm ci

      - name: Build deb
        run: npm run tauri:build -- --bundles deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: textura-deb-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/deb/*.deb
          generate_release_notes: true
