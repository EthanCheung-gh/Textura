[package]
name = "textura"
version = "0.1.0"
description = "Textura · 织理 — 结构化执行工作台"
authors = ["Textura <dev@textura.app>"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "textura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
