[package]
name = "textura"
version = "0.1.0"
description = "Textura · 织理 — 结构化执行工作台"
license = "Apache-2.0"
authors = ["Textura <dev@textura.app>"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "textura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
# AI 代理通道（src/ai_proxy.rs）：桌面端通过 IPC 让 Rust 侧直连模型网关，
# 从而绕开 webview 的 CSP `connect-src` 与浏览器 CORS。
# `default-features = false` + `rustls-tls`：不引入 openssl / 系统 TLS 依赖
# （reqwest 0.12 的 rustls 后端用 ring，交叉编译与离线打包都更省事）。
# 不开 `json` 特性：这里只发已序列化好的 String，也只按字节读响应体。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
