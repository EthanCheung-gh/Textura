[package]
cjc-version = "1.0.5"
name = "cui"
version = "0.9.6"
output-type = "static"
description = "Declarative desktop GUI framework for Cangjie"
compile-option = "-O2"

[dependencies]
# Upstream declares: sdl = { git = "https://gitcode.com/CangjieArts/SDL.git" }
# Retargeted to the vendored binding so the build stays reproducible and can host
# the aarch64-linux-ohos SDL3/SDL3_ttf artifacts under third_party/cangjie-sdl/.sdl3.
sdl = { path = "../cangjie-sdl" }