[package]
cjc-version = "1.2.0"
name = "textura_host"
version = "0.1.0"
# SDL's HarmonyOS startup dlopen()s a shared library literally named "libmain.so" and looks for
# SDL_AppInit/SDL_AppIterate there. Two layers sit between SDL and this package:
#   libmain.so        the C shim entry/src/main/cpp/host_bootstrap.c (forwards dlsym() calls here)
#   libtextura_host.so  this package, loaded by the ArkTS-side loader (requireCJLib)
# See cangjie/docs/HARMONY.md for the full startup chain.
output-type = "dynamic"
description = "Textura Cangjie host shell: CUI driven frame-by-frame from SDL on HarmonyOS"

[dependencies]
# The desktop UI is reused as source, not forked: this package depends on the desktop cjpm project
# and imports textura.ui / textura.shell / textura.core.* straight out of cangjie/src.
textura = { path = "../.." }
# Declared directly because the host imports these packages by name; `textura` pulls in the same
# vendored copies transitively, and cjpm resolves each module exactly once.
cui = { path = "../../third_party/CUI" }
sdl = { path = "../../third_party/cangjie-sdl" }

# Linking a Cangjie shared library for aarch64-linux-ohos needs the HarmonyOS native sysroot for
# crti.o/crtn.o, libc and libm; the SDL/ttf libs come from the staged `.sdl3` root that
# cangjie/scripts/harmony/build_ohos.sh swaps to the aarch64-linux-ohos copies.
#
# Two details are load-bearing here:
#   * `link-option` reaches ld.lld, `compile-option` does not — cjpm appends only link-option to the
#     final shared-library link, so the sysroot library path has to live in link-option.
#   * ld.lld resolves the bare `crti.o` / `crtn.o` that cjpm puts on that command line against the
#     link's working directory (its -L/--sysroot apply to -l lookups only). build_ohos.sh therefore
#     symlinks both objects next to this file; nothing is committed for them.
#
# `__OHOS_SYSROOT__` is a token, not a path: cjpm.toml cannot expand environment variables, so
# build_ohos.sh stamps the sysroot it detects from DEVECO_HOME into the snapshot copy of this file
# before every build (it also fails loudly if the token survives). Never edit a machine-local path
# in here — a stale absolute path links against the wrong sysroot, and moving the project to another
# machine would then fail in a confusing place. Building this package directly with `cjpm` (outside
# build_ohos.sh) does not work for the ohos target by design.
[target.aarch64-linux-ohos]
compile-option = "-O2"
link-option = "-L__OHOS_SYSROOT__/usr/lib/aarch64-linux-ohos"

# The bindings resolve their .so stubs relative to third_party/cangjie-sdl. build_ohos.sh stages the
# aarch64-linux-ohos SDL3 artifacts into that directory before the cross build (the host build keeps
# the x86_64 ones), so every FFI entry the bindings declare resolves to a matching architecture.
